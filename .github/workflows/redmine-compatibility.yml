name: Redmine compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  redmine-smoke:
    name: Redmine ${{ matrix.redmine }} / Ruby 3.3.8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - redmine: '6.0.5'
            rubyzip_requirement: '~> 2.3.0'
          - redmine: '6.1.4'
            rubyzip_requirement: '~> 2.4.0'

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin
          persist-credentials: false

      - name: Checkout Redmine ${{ matrix.redmine }}
        uses: actions/checkout@v5
        with:
          repository: redmine/redmine
          ref: ${{ matrix.redmine }}
          path: redmine
          persist-credentials: false

      - name: Set up Ruby 3.3.8
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.8

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pandoc imagemagick fonts-liberation

      - name: Configure Redmine and install plugin
        run: |
          cat > redmine/config/database.yml <<'YAML'
          production:
            adapter: sqlite3
            database: db/redmine.sqlite3
          test:
            adapter: sqlite3
            database: db/redmine_test.sqlite3
          YAML

          cp -a plugin redmine/plugins/redmine_more_previews
          rm -rf redmine/plugins/redmine_more_previews/.git

          # Redmine 6.0.5 does not pin minitest and resolves 6.x, whose Runnable.run
          # signature breaks Rails 7.2.2.1 (line_filtering.rb: wrong number of
          # arguments). 6.0-stable and 6.1.x pin it in their own Gemfile (and Bundler
          # rejects a second, different requirement), so add the pin only when the
          # Redmine Gemfile has none.
          if ! grep -q "gem 'minitest'" redmine/Gemfile; then
            cat > redmine/Gemfile.local <<'RUBY'
          gem 'minitest', '< 6.0'
          RUBY
          fi

      - name: Install Redmine bundle
        working-directory: redmine
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local without 'development'
          bundle install --jobs 4 --retry 3

      - name: Prepare Redmine database
        working-directory: redmine
        env:
          RAILS_ENV: production
        run: |
          bundle exec rake generate_secret_token
          bundle exec rake db:migrate

      - name: Verify plugin boot and dependencies
        working-directory: redmine
        env:
          RAILS_ENV: production
          EXPECTED_REDMINE: ${{ matrix.redmine }}
          EXPECTED_RUBYZIP_REQUIREMENT: ${{ matrix.rubyzip_requirement }}
        run: |
          cat > /tmp/redmine-more-previews-smoke.rb <<'RUBY'
          plugin = Redmine::Plugin.find(:redmine_more_previews)
          raise 'redmine_more_previews was not loaded' unless plugin

          redmine_version = Redmine::VERSION.to_s
          expected_redmine = ENV.fetch('EXPECTED_REDMINE')
          unless redmine_version.start_with?(expected_redmine)
            raise "Unexpected Redmine version: #{redmine_version} (expected #{expected_redmine})"
          end

          %i[mark zippy].each do |converter_id|
            RedmineMorePreviews::Converter.find(converter_id)
          end

          require 'marcel'
          require 'zip'
          require 'zlib'
          require 'mini_magick'

          rubyzip_version = Gem.loaded_specs.fetch('rubyzip').version
          rubyzip_requirement = Gem::Requirement.new(ENV.fetch('EXPECTED_RUBYZIP_REQUIREMENT'))
          unless rubyzip_requirement.satisfied_by?(rubyzip_version)
            raise "Unexpected rubyzip version: #{rubyzip_version} (expected #{rubyzip_requirement})"
          end

          mini_magick_version = Gem.loaded_specs.fetch('mini_magick').version

          puts "Redmine #{redmine_version}"
          puts "Plugin #{plugin.version}"
          puts "rubyzip #{rubyzip_version} (#{rubyzip_requirement})"
          puts "mini_magick #{mini_magick_version}"
          puts 'marcel loaded'
          puts 'zlib loaded'
          puts 'Mark and Zippy converters registered'
          RUBY

          bundle exec rails runner /tmp/redmine-more-previews-smoke.rb

      - name: Verify MiniMagick debug image generation
        working-directory: redmine
        env:
          RAILS_ENV: production
        run: |
          cat > /tmp/redmine-more-previews-minimagick.rb <<'RUBY'
          blob = RedmineMorePreviews::Lib::RmpImg.to_img("converter=debug\nstatus=ok")
          raise 'debug image is empty' if blob.nil? || blob.empty?
          raise 'debug image is not PNG' unless blob.start_with?("\x89PNG\r\n\x1a\n".b)
          puts "debug image generated (#{blob.bytesize} bytes)"
          RUBY

          bundle exec rails runner /tmp/redmine-more-previews-minimagick.rb

      - name: Verify preview security controls
        working-directory: redmine
        env:
          RAILS_ENV: production
        run: |
          cat > /tmp/redmine-more-previews-security.rb <<'RUBY'
          helper = ApplicationController.helpers

          # full HTML preview: sandboxed iframe, never <object>
          html = helper.more_previews_tag('/attachments/more_preview/1.html', 'preview.html', type: 'text/html').to_s
          raise 'HTML preview must use iframe' unless html.include?('<iframe')
          raise 'HTML preview must not use object' if html.include?('<object')
          raise 'HTML preview iframe must be sandboxed with no allow-* flags' unless html.match?(/<iframe[^>]*\ssandbox=""/)
          listing = helper.more_previews_tag('/attachments/more_preview/1.html', 'preview.html', type: 'text/html', allow_downloads: true).to_s
          raise 'archive listing iframe must allow downloads and nothing else' unless listing.match?(/<iframe[^>]*\ssandbox="allow-downloads"/)
          # the fresh DB has no converter enabled; the download decision needs Zippy
          # (and Pass, to catch HTML uploaded under an archive name)
          Setting.plugin_redmine_more_previews = Setting.plugin_redmine_more_previews.to_h.deep_merge(
            'converter' => {
              'zippy' => {'active' => '1', 'mime_types' => {'zip' => {'active' => '1', 'format' => 'html'}}},
              'pass'  => {'active' => '1', 'mime_types' => {'html' => {'active' => '1', 'format' => 'html'}}}
            }
          )
          # Setting caches per key object: the generated writer uses :plugin_x, the
          # plugin reads Setting['plugin_x'], and check_cache only runs per request
          Setting.clear_cache
          require 'zip'
          require 'tmpdir'
          csp = RedmineMorePreviews::ControllerHelper
          Dir.mktmpdir do |dir|
            real = File.join(dir, 'a.zip')
            Zip::File.open(real, Zip::File::CREATE) { |zip| zip.get_output_stream('file.txt') { |f| f.write('x') } }
            # what the decision is based on, so a failure here is diagnosable from the log
            puts "active mime types: #{RedmineMorePreviews::Converter.active_mime_types.keys.inspect}"
            puts "marcel: #{Marcel::MimeType.for(Pathname.new(real), name: File.basename(real))}"
            raise 'CSP for archive listings must allow downloads' unless csp.html_preview_csp(real).start_with?('sandbox allow-downloads; ')
            raise 'CSP for archive listings must allow nothing else' if csp.html_preview_csp(real).match?(/allow-(scripts|forms|same-origin|top-navigation|popups)/)
            page = File.join(dir, 'a.html')
            File.write(page, '<!DOCTYPE html><html><body>x</body></html>')
            raise 'CSP for other HTML previews must stay a bare sandbox' unless csp.html_preview_csp(page).start_with?('sandbox; ')
            spoof = File.join(dir, 'b.zip')
            File.write(spoof, '<!DOCTYPE html><html><body><meta http-equiv="refresh" content="0;url=/x"></body></html>')
            raise 'HTML uploaded as .zip must not get allow-downloads (Pass renders it)' unless csp.html_preview_csp(spoof).start_with?('sandbox; ')
            raise 'the same decision must work on content (repository entries)' unless csp.html_preview_csp('b.zip', :content => File.binread(spoof)).start_with?('sandbox; ')
            raise 'missing or unreadable input must fail closed' if csp.preview_allows_downloads?(File.join(dir, 'missing.zip')) || csp.preview_allows_downloads?('b.zip', :content => nil)
          end

          # inline preview: converter output is sanitised before html_safe
          untrusted = '<h1 id="t">T</h1><p><img src="x" onerror="1"></p><script>SCRIPT_BODY</script>' \
                      '<a href="javascript:1" onclick="1">l</a><svg onload="1"></svg><iframe src="//x"></iframe>' \
                      '<link rel="stylesheet" href="https://example.invalid/x.css">' \
                      '<link rel="stylesheet" href="/\\example.invalid/x.css"><link rel="stylesheet" href="/attachments/download/1/evil.css">' \
                      '<link rel="stylesheet" href="/plugin_assets/redmine_more_previews/../../x.css"><span style="position:fixed;background:url(x);font-weight:bold">c</span>' \
                      '<img name="ajaxIndicator" src="y">'
          out = helper.sanitize_inline_preview(untrusted).to_s
          %w[onerror <script SCRIPT_BODY javascript: onclick <svg onload <iframe <link position url( name=].each do |needle|
            raise "inline preview sanitiser leaked #{needle}: #{out}" if out.include?(needle)
          end
          raise 'inline preview sanitiser must keep benign markup' unless out.include?('<h1>T</h1>') && out.include?('<img src="x">') && out.include?('font-weight')
          raise 'inline preview sanitiser must return html_safe' unless helper.sanitize_inline_preview('<p>x</p>').html_safe?

          kept = helper.sanitize_inline_preview(
            '<table class="list"><tbody><tr><td class="description"><a download="a.txt" href="/attachments/more_preview/1?asset=a.txt">a.txt</a></td></tr></tbody></table>' \
            '<link rel="stylesheet" media="all" href="/plugin_assets/redmine_more_previews/converters/vince/stylesheets/redmine_more_previews_vince.css">'
          ).to_s
          %w[<table <tbody> <td download="a.txt" href="/attachments/more_preview/1?asset=a.txt" <link rel="stylesheet"].each do |needle|
            raise "inline preview sanitiser dropped converter markup #{needle}: #{kept}" unless kept.include?(needle)
          end

          # sub-URI: the converters' assets and the stylesheet allow-list move with
          # Redmine's relative url root, and nothing else becomes acceptable
          original_root = Redmine::Utils.relative_url_root
          begin
            Redmine::Utils.relative_url_root = '/redmine'
            vince_css = '/plugin_assets/redmine_more_previews/converters/vince/stylesheets/redmine_more_previews_vince.css'
            emitted = RedmineMorePreviews::Converter.find(:vince).public_web_directory
            raise "converter assets ignore the sub-URI: #{emitted}" unless emitted == '/redmine/plugin_assets/redmine_more_previews/converters/vince'
            sub_uri = helper.sanitize_inline_preview(%(<link rel="stylesheet" href="/redmine#{vince_css}">)).to_s
            raise "sub-URI stylesheet dropped: #{sub_uri}" unless sub_uri.include?("/redmine#{vince_css}")
            [vince_css, '/redmine/attachments/download/1/evil.css', '/redmine/plugin_assets/redmine_more_previews/../../x.css'].each do |href|
              leaked = helper.sanitize_inline_preview(%(<link rel="stylesheet" href="#{href}">)).to_s
              raise "sub-URI stylesheet allow-list accepted #{href}: #{leaked}" if leaked.include?('<link')
            end
          ensure
            Redmine::Utils.relative_url_root = original_root
          end

          # response headers and asset disposition
          controller = Class.new do
            include RedmineMorePreviews::ControllerHelper
            attr_reader :params, :response
            def initialize(format)
              @params   = ActionController::Parameters.new(format: format)
              @response = ActionDispatch::TestResponse.new
            end
            public :apply_preview_security_headers, :apply_asset_security_headers, :secure_asset_disposition
          end.new('html')

          controller.apply_preview_security_headers
          headers = controller.response.headers
          raise 'missing preview CSP' unless headers['Content-Security-Policy'] == RedmineMorePreviews::ControllerHelper::HTML_PREVIEW_CSP
          raise 'missing nosniff' unless headers['X-Content-Type-Options'] == 'nosniff'
          raise 'missing no-referrer' unless headers['Referrer-Policy'] == 'no-referrer'

          controller = controller.class.new('png')
          controller.apply_asset_security_headers
          raise 'asset response must be nosniff' unless controller.response.headers['X-Content-Type-Options'] == 'nosniff'

          %w[file.html file.HTM dir/file.xhtml file.svg file.xml file.xsl file.atom file.rss file.rdf file.kml file.js file.css file.unknownext file].each do |asset|
            raise "active asset must be attachment: #{asset}" unless controller.secure_asset_disposition(asset) == 'attachment'
            raise "active asset must ignore requested disposition: #{asset}" unless controller.secure_asset_disposition(asset, 'inline') == 'attachment'
          end
          %w[image.png photo.JPG anim.gif doc.pdf notes.txt clip.mp4 sound.mp3].each do |asset|
            raise "passive asset should remain inline: #{asset}" unless controller.secure_asset_disposition(asset) == 'inline'
          end
          raise 'requested disposition should be honoured for passive assets' unless controller.secure_asset_disposition('image.png', 'attachment') == 'attachment'

          # Zippy: directory names from the archive are escaped
          zip_path = '/tmp/rmp-security.zip'
          File.delete(zip_path) if File.exist?(zip_path)
          Zip::File.open(zip_path, Zip::File::CREATE) { |zip| zip.mkdir('<b>dir') }
          zippy = Zippy.allocate
          list  = []
          Zip::File.open(zip_path) { |zip| zippy.ziplist(zip, '', list) }
          toc = list.flatten.join
          raise "Zippy leaked raw directory name: #{toc}" if toc.include?('<b>dir')
          raise "Zippy must escape directory name: #{toc}" unless toc.include?('&lt;b&gt;dir')

          puts 'preview security controls verified'
          RUBY

          bundle exec rails runner /tmp/redmine-more-previews-security.rb

      - name: Run plugin test suite
        working-directory: redmine
        env:
          RAILS_ENV: test
        run: |
          bundle exec rake db:migrate
          bundle exec rake redmine:plugins:test NAME=redmine_more_previews

      - name: Verify Pandoc Markdown conversion
        run: |
          printf '# Smoke test\n\n**Redmine More Previews**\n' > /tmp/smoke.md
          pandoc /tmp/smoke.md -f markdown -t html -o /tmp/smoke.html
          grep -q '<h1' /tmp/smoke.html
          grep -q '<strong>Redmine More Previews</strong>' /tmp/smoke.html
