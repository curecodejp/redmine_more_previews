de:
  project_module_redmine_more_previews:                    "Redmine More Previews"
  label_redmine_more_previews:                             "Redmine More Previews"
  
  label_redmine_more_previews_global_settings:             "Globale Einstellungen"
  
  text_more_previews_embed_setting:                        "Einbetten des Previews in die Vorschau-Seite"
  text_more_previews_use_object_embed:                     "in <object><embed>-tag"
  text_more_previews_use_iframe:                           "in <iframe>-tag"
  text_help_redmine_more_previews_embed_settings:          "Die Option <object>-tag mit Rückfall auf <embed>-tag ist kein valides HTML, funktioniert aber auf den meisten Browsern, auch auf älteren Browsern. Die Option <iframe>-tag ist valides HTML."
  
  label_use_cache:                                         "Cache"
  text_more_previews_cache:                                "Caching des erzeugten Previews"
  text_help_redmine_more_previews_cache:                   "Caching macht die wiederholte Anzeige von Previews deutlich schneller, kann aber das /tmp-Verzeichnis im Root-Verzeichnis von Redmine aufblähen."
  text_more_previews_limits:                               "Grenzen der Konvertierung"
  label_conversion_timeout:                                "Zeitlimit (Sekunden)"
  label_lock_timeout:                                      "Wartelimit (Sekunden)"
  label_max_conversions:                                   "Gleichzeitige Konvertierungen"
  label_max_repository_file:                               "Größte Repository-Datei (MiB)"
  label_max_output:                                        "Größte ausgelieferte Vorschau (MiB)"
  label_max_cache:                                         "Cache-Größe (MiB)"
  label_failure_ttl:                                       "Fehlschläge merken für (Minuten)"
  text_help_redmine_more_previews_limits:                  "Eine Konvertierung, die länger als das Zeitlimit läuft, wird mit allen von ihr gestarteten Programmen beendet (Libre erhält mindestens 120 Sekunden). Eine Anfrage wird mit 503 (später erneut versuchen) beantwortet, wenn alle Konvertierungen, gezählt über alle Redmine-Prozesse, belegt sind oder wenn sie länger als das Wartelimit auf eine Vorschau wartet, die gerade konvertiert wird. Eine Repository-Datei oder eine Vorschau, die größer als ihr Limit ist, wird mit 413 beantwortet. Ist der Cache größer als seine Größe, werden neue Vorschauen bei jeder Anfrage konvertiert und nicht gespeichert. Eine fehlgeschlagene Konvertierung wird, solange sie gemerkt wird, nicht erneut versucht, bis ein Administrator die Vorschau neu lädt. Neu laden und die unsichere Vorschau von E-Mails sind Administratoren vorbehalten."
  text_more_previews_busy:                                 "Die Vorschau wird gerade erzeugt oder der Server ist ausgelastet. Bitte versuchen Sie es später erneut."
  text_more_previews_too_large:                            "Die Datei ist für eine Vorschau zu groß."
  text_more_previews_image_failed:                         "Die Vorschau konnte nicht angezeigt werden. Das Bild ist möglicherweise zu groß (die Grenzen sind 16.000 Pixel Breite oder Höhe und insgesamt 128 Megapixel sowie für HEIC- und TIFF-Bilder die in den Maggie-Einstellungen festgelegte Größe), oder die Konvertierung ist fehlgeschlagen. Laden Sie die Datei herunter, um sie anzusehen."
  error_more_previews_invalid_libre_format:                "Ungültiges LibreOffice-Konvertierungsformat; die Einstellungen wurden nicht gespeichert."
  error_more_previews_unreadable_image_format:             "ImageMagick kann %{formats} nicht lesen (prüfen mit: convert -list format, bei ImageMagick 7 magick -list format); die Einstellungen wurden nicht gespeichert."
  
  label_redmine_more_previews_plugins_settings:            "Plugins Einstellungen"
  
  button_unsafe_update:                                    "Unsicher Aktualisieren"
  
  label_debug:                                             "Debug"
  text_help_redmine_more_previews_debug:                   "Zeige Debug-Informationen anstelle einer konvertierten Datei"
  
  label_use_absolute_path:                                 "URL mit Host"
  text_help_redmine_more_previews_absolute:                "(URL mit Schema und Host) für <iframe>-tag oder <embed>-tag nutzen."
  text_more_previews_inline_too_large: "Die Inline-Vorschau überschreitet die Größenbegrenzung. Laden Sie die Datei herunter, um sie anzusehen."
  text_more_previews_inline_too_complex: "Die Inline-Vorschau ist zu komplex für die Anzeige. Laden Sie die Datei herunter, um sie anzusehen."
