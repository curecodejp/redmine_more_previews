en:
  project_module_redmine_more_previews:                    "Redmine More Previews"
  label_redmine_more_previews:                             "Redmine More Previews"
  
  label_redmine_more_previews_global_settings:             "Global settings"
  
  text_more_previews_embed_setting:                        "Embedding of preview into preview pane"
  text_more_previews_use_object_embed:                     "with <object><embed>-tag"
  text_more_previews_use_iframe:                           "with <iframe>-tag"
  text_help_redmine_more_previews_embed_settings:          "The option <object>-tag with fallback to an <embed>-tag is not valid html, but will work with most browsers, even with older browsers. The option <iframe>-tag is valid HTML."
  
  label_use_cache:                                         "Cache"
  text_more_previews_cache:                                "Caching of created preview"
  text_help_redmine_more_previews_cache:                   "Caching makes repeated viewing of previews much faster, but may bloat the /tmp-directory in the root-directory of Redmine."
  
  text_more_previews_limits:                               "Conversion limits"
  label_conversion_timeout:                                "Time limit (seconds)"
  label_lock_timeout:                                      "Wait limit (seconds)"
  label_max_conversions:                                   "Conversions at the same time"
  label_max_repository_file:                               "Largest repository file (MiB)"
  label_max_output:                                        "Largest preview served (MiB)"
  label_max_cache:                                         "Cache size (MiB)"
  label_failure_ttl:                                       "Failures remembered for (minutes)"
  text_help_redmine_more_previews_limits:                  "A conversion running longer than the time limit is stopped with all the programs it started (Libre gets at least 120 seconds). A request is answered with 503 (try again later) when all the conversions, counted over all Redmine processes, are taken, or when it waits longer than the wait limit for a preview that is being converted. A repository file or a preview larger than its limit is answered with 413. Once the cache is larger than its size, new previews are converted for each request and not stored. A failed conversion is not tried again for the time it is remembered, until an administrator reloads the preview. Reloading and the unsafe preview of emails are for administrators only."
  text_more_previews_busy:                                 "The preview is being generated or the server is busy. Please try again later."
  text_more_previews_too_large:                            "The file is too large to be previewed."
  
  label_redmine_more_previews_plugins_settings:            "Plugins settings"
  
  button_unsafe_update:                                    "Unsafe reload"
  
  label_debug:                                             "Debug"
  text_help_redmine_more_previews_debug:                   "Show debug information instead of a converted file"
  
  label_use_absolute_path:                                 "URL with host"
  text_help_redmine_more_previews_absolute:                "(use URL with scheme and host) for <iframe>-tag or <embed>-tag."