es:
  project_module_redmine_more_previews:                    "Redmine More Previews"
  label_redmine_more_previews:                             "Redmine More Previews"
  
  label_redmine_more_previews_global_settings:             "Ajustes globales"
  
  text_more_previews_embed_setting:                        "Incrustación de la vista previa en el panel de vista previa"
  text_more_previews_use_object_embed:                     "con <object><embed>-tag"
  text_more_previews_use_iframe:                           "con <iframe>-tag"
  text_help_redmine_more_previews_embed_settings:          "La opción <objeto>-tag con retroceso a un <embed>-tag no es html válido, pero funcionará con la mayoría de los navegadores, incluso con los más antiguos. La opción <iframe>-tag es HTML válido."
  
  label_use_cache:                                         "Cache"
  text_more_previews_cache:                                "Caching de la vista previa creada"
  text_help_redmine_more_previews_cache:                   "El almacenamiento en caché hace que la repetición de vistas previas sea mucho más rápida, pero puede inflar el directorio /tmp en el directorio raíz de Redmine."
  text_more_previews_limits:                               "Límites de conversión"
  label_conversion_timeout:                                "Límite de tiempo (segundos)"
  label_lock_timeout:                                      "Límite de espera (segundos)"
  label_max_conversions:                                   "Conversiones simultáneas"
  label_max_repository_file:                               "Archivo de repositorio más grande (MiB)"
  label_max_output:                                        "Vista previa servida más grande (MiB)"
  label_max_cache:                                         "Tamaño de la caché (MiB)"
  label_failure_ttl:                                       "Fallos recordados durante (minutos)"
  text_help_redmine_more_previews_limits:                  "Una conversión que dura más que el límite de tiempo se detiene junto con todos los programas que inició (Libre dispone de al menos 120 segundos). Una solicitud se responde con 503 (inténtelo más tarde) cuando todas las conversiones, contadas en todos los procesos de Redmine, están ocupadas, o cuando espera más que el límite de espera una vista previa que se está convirtiendo. Un archivo de repositorio o una vista previa mayor que su límite se responde con 413. Cuando la caché supera su tamaño, las nuevas vistas previas se convierten en cada solicitud y no se guardan. Una conversión fallida no se vuelve a intentar mientras se recuerda, hasta que un administrador recarga la vista previa. Recargar y la vista previa no segura de los correos electrónicos están reservados a los administradores."
  text_more_previews_busy:                                 "La vista previa se está generando o el servidor está ocupado. Inténtelo de nuevo más tarde."
  text_more_previews_too_large:                            "El archivo es demasiado grande para mostrar una vista previa."
  text_more_previews_image_failed:                         "No se pudo mostrar la vista previa. Puede que la imagen sea demasiado grande (los límites son 16.000 píxeles de ancho o de alto y 128 megapíxeles en total, y el tamaño fijado en la configuración de Maggie para las imágenes HEIC y TIFF), o que la conversión haya fallado. Descargue el archivo para verlo."
  error_more_previews_invalid_libre_format:                "Formato de conversión de LibreOffice no válido; la configuración no se guardó."
  error_more_previews_unreadable_image_format:             "ImageMagick no puede leer %{formats} (compruébelo con: convert -list format, o magick -list format con ImageMagick 7); la configuración no se guardó."
  
  label_redmine_more_previews_plugins_settings:            "Configuración de los plugins"
  
  button_unsafe_update:                                    "Recarga insegura"
  
  label_debug:                                             "Debug"
  text_help_redmine_more_previews_debug:                   "Mostrar información de debug en lugar de un archivo convertido"
  
  label_use_absolute_path:                                 "URL con host"
  text_help_redmine_more_previews_absolute:                "(usar URL con esquema y host) para la etiqueta <iframe> o la etiqueta <embed>"
  text_more_previews_inline_too_large: "La vista previa integrada supera el límite de tamaño. Descargue el archivo para verlo."
  text_more_previews_inline_too_complex: "La vista previa integrada es demasiado compleja para mostrarse. Descargue el archivo para verlo."
  text_more_previews_inline_failed:      "No se pudo mostrar la vista previa. Descargue el archivo para verlo."
  label_more_previews_bulk_actions:                        "Acciones en bloque"
  label_more_previews_toggle_all_extensions:               "Activar o desactivar todas las extensiones"
  label_more_previews_bulk_format:                         "Formato para todas las extensiones"
