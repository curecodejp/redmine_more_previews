pt-BR:
  project_module_redmine_more_previews:                    "Redmine More Previews"
  label_redmine_more_previews:                             "Redmine More Previews"
  
  label_redmine_more_previews_global_settings:             "Configurações globais"
  
  text_more_previews_embed_setting:                        "Embutir a visualização na página de visualização"
  text_more_previews_use_object_embed:                     "em <objecto>>embed>-tag"
  text_more_previews_use_iframe:                           "em < se for de >-tag"
  text_help_redmine_more_previews_embed_settings:          "A opção <objeto>-tag com retorno para <embed>-tag não é HTML válido, mas funciona na maioria dos navegadores, incluindo navegadores mais antigos. A opção <iframe>-tag é HTML válida."
  
  label_use_cache:                                         "Cache"
  text_more_previews_cache:                                "Caching da visualização gerada"
  text_help_redmine_more_previews_cache:                   "O cache torna a exibição repetida de visualizações muito mais rápida, mas pode inchar o diretório /tmp no diretório raiz da Redmine."
  text_more_previews_limits:                               "Limites de conversão"
  label_conversion_timeout:                                "Limite de tempo (segundos)"
  label_lock_timeout:                                      "Limite de espera (segundos)"
  label_max_conversions:                                   "Conversões simultâneas"
  label_max_repository_file:                               "Maior arquivo do repositório (MiB)"
  label_max_output:                                        "Maior pré-visualização servida (MiB)"
  label_max_cache:                                         "Tamanho do cache (MiB)"
  label_failure_ttl:                                       "Falhas lembradas por (minutos)"
  text_help_redmine_more_previews_limits:                  "Uma conversão que demora mais do que o limite de tempo é interrompida junto com todos os programas que iniciou (o Libre tem pelo menos 120 segundos). Uma requisição recebe a resposta 503 (tente mais tarde) quando todas as conversões, contadas em todos os processos do Redmine, estão ocupadas, ou quando espera mais do que o limite de espera por uma pré-visualização que está sendo convertida. Um arquivo do repositório ou uma pré-visualização maior do que seu limite recebe a resposta 413. Quando o cache excede seu tamanho, as novas pré-visualizações são convertidas a cada requisição e não são salvas. Uma conversão que falhou não é tentada novamente enquanto for lembrada, até que um administrador recarregue a pré-visualização. Recarregar e a pré-visualização não segura de e-mails são exclusivos dos administradores."
  text_more_previews_busy:                                 "A pré-visualização está sendo gerada ou o servidor está ocupado. Tente novamente mais tarde."
  text_more_previews_too_large:                            "O arquivo é grande demais para ser pré-visualizado."
  text_more_previews_image_failed:                         "Não foi possível exibir a pré-visualização. A imagem pode ser grande demais (os limites são 16.000 pixels de largura ou altura e 128 megapixels no total, e o tamanho definido nas configurações do Maggie para imagens HEIC e TIFF), ou a conversão pode ter falhado. Baixe o arquivo para visualizá-lo."
  error_more_previews_invalid_libre_format:                "Formato de conversão do LibreOffice inválido; as configurações não foram salvas."
  error_more_previews_unreadable_image_format:             "O ImageMagick não consegue ler %{formats} (verifique com: convert -list format, ou magick -list format no ImageMagick 7); as configurações não foram salvas."
  
  label_redmine_more_previews_plugins_settings:            "Configurações dos Plugins"
  
  button_unsafe_update:                                    "Atualização insegura"
  label_debug:                                             "Depuração"
  
  text_help_redmine_more_previews_debug:                   "Mostrar informações de debug em vez de um arquivo convertido"
  
  label_use_absolute_path:                                 "URL com host"
  text_help_redmine_more_previews_absolute:                "(usar URL com esquema e host) para <iframe>-tag ou <embed>-tag"
  text_more_previews_inline_too_large: "A pré-visualização excede o limite de tamanho. Baixe o arquivo para visualizá-lo."
  text_more_previews_inline_too_complex: "A pré-visualização é complexa demais para ser exibida. Baixe o arquivo para visualizá-lo."
  text_more_previews_inline_failed:      "Não foi possível exibir a pré-visualização. Baixe o arquivo para visualizá-lo."
  label_more_previews_bulk_actions:                        "Ações em massa"
  label_more_previews_toggle_all_extensions:               "Ativar ou desativar todas as extensões"
  label_more_previews_bulk_format:                         "Formato para todas as extensões"
