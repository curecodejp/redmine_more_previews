ru:
  project_module_redmine_more_previews:                    "Redmine More Previews"
  label_redmine_more_previews:                             "Redmine More Previews"
  
  label_redmine_more_previews_global_settings:             "Глобальные настройки"
  
  text_more_previews_embed_setting:                        "Встраивание предварительного просмотра в панель предварительного просмотра"
  text_more_previews_use_object_embed:                     "c <object><embed>-tag"
  text_more_previews_use_iframe:                           "c <iframe>-tag"
  text_help_redmine_more_previews_embed_settings:          "Опция <object>-тег с откатом к <embed>-тегу не является допустимым html, но будет работать с большинством браузеров, даже со старыми браузерами. Опция <iframe>-тег является допустимым HTML."
  
  label_use_cache:                                         "Кэш"
  text_more_previews_cache:                                "Кэширование созданного просмотра"
  text_help_redmine_more_previews_cache:                   "Докучание делает повторный просмотр превью намного быстрее, но может раздуть /tmp-директорию в корневой директории Redmine."
  text_more_previews_limits:                               "Ограничения преобразования"
  label_conversion_timeout:                                "Ограничение времени (секунды)"
  label_lock_timeout:                                      "Ограничение ожидания (секунды)"
  label_max_conversions:                                   "Одновременных преобразований"
  label_max_repository_file:                               "Наибольший файл репозитория (МиБ)"
  label_max_output:                                        "Наибольший отдаваемый просмотр (МиБ)"
  label_max_cache:                                         "Размер кэша (МиБ)"
  label_failure_ttl:                                       "Сколько помнить ошибки (минуты)"
  text_help_redmine_more_previews_limits:                  "Преобразование, длящееся дольше ограничения времени, останавливается вместе со всеми запущенными им программами (Libre получает не менее 120 секунд). На запрос отвечается кодом 503 (повторите позже), если заняты все преобразования, считая по всем процессам Redmine, или если запрос ждёт преобразуемый просмотр дольше ограничения ожидания. На файл репозитория или просмотр, превышающий свой предел, отвечается кодом 413. Когда кэш превышает свой размер, новые просмотры преобразуются при каждом запросе и не сохраняются. Неудавшееся преобразование не повторяется, пока ошибка помнится, если администратор не перезагрузит просмотр. Перезагрузка и небезопасный просмотр писем доступны только администраторам."
  text_more_previews_busy:                                 "Предварительный просмотр создаётся, или сервер занят. Повторите попытку позже."
  text_more_previews_too_large:                            "Файл слишком большой для предварительного просмотра."
  text_more_previews_image_failed:                         "Не удалось показать предварительный просмотр. Возможно, изображение слишком большое (ограничения: 16 000 пикселей по ширине или высоте и 128 мегапикселей всего, а для изображений HEIC и TIFF — размер, заданный в настройках Maggie), или преобразование не удалось. Скачайте файл для просмотра."
  error_more_previews_invalid_libre_format:                "Недопустимый формат преобразования LibreOffice; настройки не сохранены."
  error_more_previews_unreadable_image_format:             "ImageMagick не может прочитать %{formats} (проверьте: convert -list format, для ImageMagick 7 magick -list format); настройки не сохранены."
  
  label_redmine_more_previews_plugins_settings:            "Настройки плагинов"
  
  button_unsafe_update:                                    "Небезопасная перезагрузка"
  label_debug:                                             "Отладка"
  
  text_help_redmine_more_previews_debug:                   "Показывать отладочную информацию вместо преобразованного файла"
  
  
  label_use_absolute_path:                                 "URL с хостом"
  text_help_redmine_more_previews_absolute:                "(используйте URL со схемой и хостом) для <iframe>-тега или <embed>-тега."
  text_more_previews_inline_too_large: "Размер встроенного предварительного просмотра превышает допустимый предел. Скачайте файл для просмотра."
  text_more_previews_inline_too_complex: "Встроенный предварительный просмотр слишком сложен для отображения. Скачайте файл для просмотра."
  text_more_previews_inline_failed:      "Не удалось показать предварительный просмотр. Скачайте файл для просмотра."
  label_more_previews_bulk_actions:                        "Групповые действия"
  label_more_previews_toggle_all_extensions:               "Включить или выключить все расширения"
  label_more_previews_bulk_format:                         "Формат для всех расширений"
